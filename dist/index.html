<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>StickyNotes</title>
<style>
  :root {
    --bg: #fafaf9; --surface: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #f59e0b; --accent-fg: #1c1917; --danger: #dc2626;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
  }
  html.dark {
    --bg: #18181b; --surface: #27272a; --text: #fafafa; --muted: #a1a1aa;
    --border: #3f3f46; --accent: #fbbf24; --accent-fg: #18181b; --danger: #f87171;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
    color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    -webkit-app-region: drag;
  }
  header .spacer { flex: 1; }
  .icon-btn, .btn {
    -webkit-app-region: no-drag;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .icon-btn { padding: 5px 8px; line-height: 1; }
  .icon-btn:hover, .btn:hover { background: var(--bg); border-color: var(--muted); }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn-primary:hover { background: var(--accent); opacity: .9; }
  main { flex: 1; overflow-y: auto; padding: 10px; user-select: text; }
  .composer { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  textarea, input[type=number] {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font: inherit; outline: none;
    transition: border-color .15s;
  }
  textarea { min-height: 56px; resize: vertical; }
  textarea:focus, input[type=number]:focus { border-color: var(--accent); }
  .note {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    box-shadow: var(--shadow);
    display: flex; flex-direction: column; gap: 4px;
  }
  .note .text { white-space: pre-wrap; word-break: break-word; user-select: text; }
  .note .meta {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 11px;
  }
  .note .actions { display: flex; gap: 2px; }
  .note .actions button {
    background: transparent; border: none; color: var(--muted);
    cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 11px;
  }
  .note .actions button:hover { color: var(--text); background: var(--bg); }
  .note textarea { min-height: 64px; margin-top: 4px; }

  .settings {
    position: absolute; inset: 0; background: var(--bg);
    display: none; flex-direction: column; z-index: 10;
  }
  .settings.open { display: flex; }
  .settings header { -webkit-app-region: drag; }
  .settings-body { flex: 1; overflow-y: auto; padding: 12px; user-select: text; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--border); gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row .label { font-size: 12px; }
  .row .sub { font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .row .left { flex: 1; min-width: 0; }
  .switch {
    -webkit-app-region: no-drag;
    width: 32px; height: 18px; background: var(--border); border-radius: 999px;
    position: relative; cursor: pointer; transition: background .15s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; background: #fff; border-radius: 50%;
    transition: transform .15s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(14px); }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--muted); margin: 14px 0 4px; font-weight: 600;
  }
  .section-title:first-child { margin-top: 0; }

  .size-inputs { display: flex; gap: 6px; align-items: center; }
  .size-inputs input { width: 64px; padding: 4px 6px; text-align: center; }
  .size-inputs span { color: var(--muted); font-size: 11px; }

  .dropdown { position: relative; }
  .dd-trigger {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 28px 5px 10px; font-size: 12px; cursor: pointer;
    min-width: 110px; text-align: left; position: relative;
  }
  .dd-trigger::after {
    content: "▾"; position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%); font-size: 10px; color: var(--muted);
    transition: transform .15s;
  }
  .dropdown.open .dd-trigger::after { transform: translateY(-50%) rotate(180deg); }
  .dd-menu {
    position: absolute; right: 0; top: calc(100% + 4px);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; box-shadow: var(--shadow);
    min-width: 140px; z-index: 20; display: none; overflow: hidden;
  }
  .dropdown.open .dd-menu { display: block; }
  .dd-item {
    padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .dd-item:hover { background: var(--bg); }
  .dd-item.active { color: var(--accent); }
</style>
</head>
<body>
  <div id="app">
    <header>
      <button class="icon-btn" id="theme-btn" title="切换主题">🌙</button>
      <button class="icon-btn" id="settings-btn" title="设置">⚙</button>
      <div class="spacer"></div>
      <button class="btn btn-primary" id="add-btn">添加</button>
    </header>
    <main>
      <div class="composer">
        <textarea id="composer" placeholder="今日计划、目标、灵感…  Ctrl+Enter 添加"></textarea>
      </div>
      <div id="list"></div>
    </main>
  </div>

  <div class="settings" id="settings">
    <header>
      <button class="icon-btn" id="settings-back">‹ 返回</button>
      <div class="spacer"></div>
      <span style="color:var(--muted);font-size:12px;">设置</span>
    </header>
    <div class="settings-body">
      <div class="section-title">外观</div>
      <div class="row">
        <div class="left"><div class="label">深色模式</div></div>
        <div class="switch" id="sw-theme"></div>
      </div>
      <div class="row">
        <div class="left"><div class="label">窗口置顶</div></div>
        <div class="switch" id="sw-pin"></div>
      </div>

      <div class="section-title">窗口</div>
      <div class="row">
        <div class="left"><div class="label">自定义窗口大小</div><div class="sub">宽 × 高（像素）</div></div>
        <div class="size-inputs">
          <input type="number" id="win-w" min="280" max="2000" step="10" />
          <span>×</span>
          <input type="number" id="win-h" min="360" max="2000" step="10" />
          <button class="btn" id="apply-size">应用</button>
        </div>
      </div>
      <div class="row">
        <div class="left"><div class="label">关闭窗口时</div><div class="sub">点击窗口右上角 × 时的行为</div></div>
        <div class="dropdown" id="dd-close">
          <button class="dd-trigger" id="dd-close-trigger">最小化</button>
          <div class="dd-menu">
            <div class="dd-item" data-val="minimize">最小化（保留在后台）</div>
            <div class="dd-item" data-val="close">关闭程序</div>
          </div>
        </div>
      </div>

      <div class="section-title">存储</div>
      <div class="row">
        <div class="left"><div class="label">笔记位置</div><div class="sub" id="storage-path">…</div></div>
        <button class="btn" id="pick-dir">选择…</button>
      </div>

      <div class="section-title">数据</div>
      <div class="row"><div class="left"><div class="label">本地备份</div><div class="sub">在存储目录生成时间戳副本</div></div><button class="btn" id="backup-btn">备份</button></div>
      <div class="row"><div class="left"><div class="label">导出</div><div class="sub">保存为 JSON 文件</div></div><button class="btn" id="export-btn">导出</button></div>
      <div class="row"><div class="left"><div class="label">导入并合并</div><div class="sub">追加到现有便签</div></div><button class="btn" id="import-merge">导入</button></div>
      <div class="row"><div class="left"><div class="label">导入并覆盖</div><div class="sub">替换全部便签</div></div><button class="btn" id="import-replace">覆盖</button></div>
    </div>
  </div>

<script>
const invoke = window.__TAURI__.invoke;
let notes = [];
let cfg = null;

const $ = (s) => document.querySelector(s);
const list = $('#list');
const composer = $('#composer');

function fmt(t) {
  const d = new Date(t);
  const pad = (n) => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function render() {
  list.innerHTML = '';
  for (const n of [...notes].reverse()) {
    const el = document.createElement('div');
    el.className = 'note';
    el.dataset.id = n.id;
    el.innerHTML = `
      <div class="text"></div>
      <div class="meta">
        <span>${fmt(n.updatedAt || n.createdAt)}</span>
        <div class="actions">
          <button data-act="edit">编辑</button>
          <button data-act="del">删除</button>
        </div>
      </div>`;
    el.querySelector('.text').textContent = n.text;
    list.appendChild(el);
  }
}

async function persist() { try { await invoke('save_notes', { notes }); } catch(e){ console.error(e); } }

async function add() {
  const t = composer.value.trim();
  if (!t) return;
  notes.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), text: t, createdAt: Date.now(), updatedAt: Date.now() });
  composer.value = '';
  render(); await persist();
}

list.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const row = e.target.closest('.note');
  const id = row.dataset.id;
  const i = notes.findIndex(n => n.id === id);
  if (i < 0) return;
  if (btn.dataset.act === 'del') {
    notes.splice(i, 1); render(); await persist();
  } else if (btn.dataset.act === 'edit') {
    const n = notes[i];
    row.innerHTML = `
      <textarea class="edit"></textarea>
      <div class="meta">
        <span>${fmt(n.createdAt)}</span>
        <div class="actions">
          <button data-act="save">保存</button>
          <button data-act="cancel">取消</button>
        </div>
      </div>`;
    const ta = row.querySelector('.edit');
    ta.value = n.text; ta.focus();
  } else if (btn.dataset.act === 'save') {
    const v = row.querySelector('.edit').value.trim();
    if (v) { notes[i].text = v; notes[i].updatedAt = Date.now(); }
    render(); await persist();
  } else if (btn.dataset.act === 'cancel') {
    render();
  }
});

$('#add-btn').onclick = add;
composer.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); add(); }
});

function applyTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  $('#theme-btn').textContent = t === 'dark' ? '☀' : '🌙';
  setSwitch($('#sw-theme'), t === 'dark');
}
function setSwitch(el, on) { el.classList.toggle('on', !!on); }

$('#theme-btn').onclick = async () => {
  const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  cfg.theme = await invoke('set_theme', { theme: next });
  applyTheme(cfg.theme);
};

$('#settings-btn').onclick = () => $('#settings').classList.add('open');
$('#settings-back').onclick = () => $('#settings').classList.remove('open');

$('#sw-theme').onclick = () => $('#theme-btn').click();
$('#sw-pin').onclick = async () => {
  cfg.always_on_top = await invoke('set_pin', { value: !cfg.always_on_top });
  setSwitch($('#sw-pin'), cfg.always_on_top);
};

$('#pick-dir').onclick = async () => {
  const p = await invoke('pick_storage_dir');
  if (p) { cfg.storage_dir = p; $('#storage-path').textContent = p; notes = await invoke('get_notes'); render(); }
};
$('#backup-btn').onclick = async () => { try { const p = await invoke('backup_notes'); alert('已备份: ' + p); } catch(e){ alert('失败: '+e); } };
$('#export-btn').onclick = async () => { const p = await invoke('export_notes'); if (p) alert('已导出: ' + p); };
$('#import-merge').onclick = async () => { try { notes = await invoke('import_notes', { mode: 'merge' }); render(); } catch(e){} };
$('#import-replace').onclick = async () => { try { notes = await invoke('import_notes', { mode: 'replace' }); render(); } catch(e){} };

// Window size apply
$('#apply-size').onclick = async () => {
  const w = parseFloat($('#win-w').value), h = parseFloat($('#win-h').value);
  if (!Number.isFinite(w) || !Number.isFinite(h)) return;
  try { await invoke('set_window_size', { width: w, height: h }); } catch(e){ alert('失败: '+e); }
};

// Close-action dropdown
const closeLabels = { minimize: '最小化', close: '关闭程序' };
const dd = $('#dd-close');
function setCloseAction(val) {
  cfg.close_action = val;
  $('#dd-close-trigger').textContent = closeLabels[val] || '最小化';
  dd.querySelectorAll('.dd-item').forEach(it => it.classList.toggle('active', it.dataset.val === val));
}
$('#dd-close-trigger').onclick = (e) => { e.stopPropagation(); dd.classList.toggle('open'); };
dd.querySelectorAll('.dd-item').forEach(it => {
  it.onclick = async () => {
    const v = it.dataset.val;
    dd.classList.remove('open');
    try { const r = await invoke('set_close_action', { action: v }); setCloseAction(r); } catch(e){}
  };
});
document.addEventListener('click', () => dd.classList.remove('open'));

// Persist window bounds (debounced)
let boundsTimer;
window.addEventListener('resize', () => {
  clearTimeout(boundsTimer);
  boundsTimer = setTimeout(async () => {
    const w = window.outerWidth, h = window.outerHeight;
    const x = window.screenX, y = window.screenY;
    try { await invoke('save_bounds', { x, y, width: w, height: h }); } catch(e){}
    $('#win-w').value = Math.round(w); $('#win-h').value = Math.round(h);
  }, 400);
});

(async () => {
  cfg = await invoke('get_config');
  applyTheme(cfg.theme);
  setSwitch($('#sw-pin'), cfg.always_on_top);
  $('#storage-path').textContent = cfg.storage_dir;
  $('#win-w').value = Math.round(cfg.bounds.width);
  $('#win-h').value = Math.round(cfg.bounds.height);
  setCloseAction(cfg.close_action || 'minimize');
  notes = await invoke('get_notes');
  render();
})();
</script>
</body>
</html>
